<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f8faf9"/>
  <rect width="1200" height="8" fill="#2d7a4a"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e2e8e4" stroke-width="2"/>

  <!-- Ping pong ball decoration -->
  <circle cx="1080" cy="160" r="120" fill="#2d7a4a" opacity="0.06"/>
  <circle cx="140" cy="480" r="80" fill="#2d7a4a" opacity="0.05"/>

  <!-- Logo -->
  <text x="80" y="120" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#2d7a4a" letter-spacing="2">TENNIS TAULA</text>
  <text x="80" y="158" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1a1a1a" letter-spacing="2">CATALUNYA</text>

