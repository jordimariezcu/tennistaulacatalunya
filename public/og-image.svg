  <text x="80" y="348" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#1a1a1a" letter-spacing="-1">i notícies de</text>
  <text x="80" y="416" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#2d7a4a" letter-spacing="-1">Catalunya</text>

  <!-- Subtitle -->
  <text x="80" y="500" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">Blog de tennis taula en català · tennistaulacatalunya.com</text>

  <!-- Categories pills -->
  <rect x="80" y="540" width="110" height="36" rx="18" fill="#2d7a4a" opacity="0.12"/>
  <text x="135" y="563" font-family="system-ui, sans-serif" font-size="15" fill="#1f5c36" text-anchor="middle" font-weight="600">Fustes</text>

  <rect x="204" y="540" width="110" height="36" rx="18" fill="#2d7a4a" opacity="0.12"/>
  <text x="259" y="563" font-family="system-ui, sans-serif" font-size="15" fill="#1f5c36" text-anchor="middle" font-weight="600">Gomes</text>

  <rect x="328" y="540" width="155" height="36" rx="18" fill="#2d7a4a" opacity="0.12"/>
  <text x="406" y="563" font-family="system-ui, sans-serif" font-size="15" fill="#1f5c36" text-anchor="middle" font-weight="600">Configuracions</text>

  <rect x="497" y="540" width="100" height="36" rx="18" fill="#2d7a4a" opacity="0.12"/>
  <text x="547" y="563" font-family="system-ui, sans-serif" font-size="15" fill="#1f5c36" text-anchor="middle" font-weight="600">Guies</text>

  <rect x="611" y="540" width="120" height="36" rx="18" fill="#2d7a4a" opacity="0.12"/>
  <text x="671" y="563" font-family="system-ui, sans-serif" font-size="15" fill="#1f5c36" text-anchor="middle" font-weight="600">Notícies</text>
